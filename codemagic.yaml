workflows:
  ios-simulator:
    name: iOS Simulator (Debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Optional: set in Codemagic UI as secure variables.
        # APPETIZE_API_TOKEN: ""
    cache:
      cache_paths:
        - "$HOME/.pub-cache"
        - "$FLUTTER_ROOT/.pub-cache"
        - "~/.cocoapods"
        - "ios/Pods"
    scripts:
      - name: Flutter version
        script: flutter --version
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build iOS Simulator .app
        script: |
          flutter config --enable-ios
          flutter build ios --debug --simulator --no-codesign
      - name: Zip .app for sharing/testing
        script: |
          set -euo pipefail
          APP_DIR="build/ios/iphonesimulator/Runner.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Runner.app not found at $APP_DIR" >&2
            exit 1
          fi
          pushd "$(dirname "$APP_DIR")" >/dev/null
          zip -r -y Runner.app.zip "$(basename "$APP_DIR")"
          popd >/dev/null
      - name: Optional upload to Appetize.io
        script: |
          set -euo pipefail
          ZIP_PATH="build/ios/iphonesimulator/Runner.app.zip"
          if [ -n "${APPETIZE_API_TOKEN:-}" ]; then
            echo "Uploading simulator build to Appetize.io..."
            curl -fsSL -X POST https://api.appetize.io/v1/apps \
              -H "Authorization: Bearer ${APPETIZE_API_TOKEN}" \
              -F "file=@${ZIP_PATH}" \
              -F "platform=ios" \
              -F "note=Celia iOS simulator build $(date +%Y-%m-%dT%H:%M:%S)" || {
                echo "Appetize upload failed (non-fatal)." >&2
              }
          else
            echo "APPETIZE_API_TOKEN not set; skipping Appetize upload."
          fi
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - build/ios/iphonesimulator/Runner.app.zip

  ios-adhoc:
    name: iOS Device (signed .ipa Ad Hoc)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: eu.thefit.celia
    cache:
      cache_paths:
        - "$HOME/.pub-cache"
        - "$FLUTTER_ROOT/.pub-cache"
        - "~/.cocoapods"
        - "ios/Pods"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build signed IPA
        script: flutter build ipa --release --export-method ad-hoc --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-app-store:
    name: iOS App Store (signed .ipa)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.thefit.celia
    cache:
      cache_paths:
        - "$HOME/.pub-cache"
        - "$FLUTTER_ROOT/.pub-cache"
        - "~/.cocoapods"
        - "ios/Pods"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build App Store IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

