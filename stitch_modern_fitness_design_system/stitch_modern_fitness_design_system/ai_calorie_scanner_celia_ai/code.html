<style>
        .glass-panel {
            background-color: rgba(30, 34, 53, 0.60);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .kinetic-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .scanner-line {
            background: linear-gradient(to bottom, transparent, #ffb691, transparent);
            animation: scan 3s linear infinite;
        }
        
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-hidden relative">
<!-- Camera Feed Background (Simulated) -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A top-down, high-quality photograph of a healthy salad bowl containing mixed greens, cherry tomatoes, sliced grilled chicken breast, and avocado. The image is taken from a first-person perspective, simulating a smartphone camera viewfinder. The lighting is bright and natural, highlighting the fresh textures of the food. The background surface is a dark, sleek table, aligning with a modern, high-performance aesthetic. The image serves as the live camera feed for an AI calorie scanning application." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAdYEOucbVeKoJH1GMGy1eNOIrY2vQvkZegup29XY19sMk6ViuzuyudLTPfBugeAzh48-xRT-7l-5pGWO83JLzWgHGjpeo8S50jDyz453JQLbmc5c0B51Zk-QveUzcxLlKO7chIONxlr2eCU4hkDeliA9CFB94ym3oGFpIYsyRYmdsyMhv8DIS4vMPtW64SwyQrjWhgGjX3JNtDd_N_5qsmkqjSVze0WMVg7tzVcfKVC3Ibdsh_BrAMKM1up7_DTXuDy2uYgqOQaXBP');">
<!-- Dark Overlay for better UI contrast -->
<div class="absolute inset-0 bg-background/30 mix-blend-multiply"></div>
<!-- Scanning Animation Line -->
<div class="absolute left-0 right-0 h-32 w-full scanner-line z-10 opacity-40"></div>
<!-- Bounding Box 1: Chicken -->
<div class="absolute top-[35%] left-[25%] z-20">
<!-- Box -->
<div class="w-24 h-24 border-2 border-primary rounded-lg relative">
<!-- Corner accents -->
<div class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-primary"></div>
<div class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-primary"></div>
<div class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-primary"></div>
<div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-primary"></div>
</div>
<!-- Label -->
<div class="absolute -top-8 left-1/2 -translate-x-1/2 whitespace-nowrap glass-panel px-3 py-1 rounded-full flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary kinetic-pulse relative"><div class="absolute inset-0 rounded-full bg-primary"></div></div>
<span class="font-label-caps text-label-caps text-on-surface">Grilled Chicken - 150g</span>
</div>
<!-- Connecting Line to Card (Visual only, CSS drawn) -->
<svg class="absolute top-1/2 left-full w-[150px] h-[100px] pointer-events-none" style="overflow: visible;">
<path d="M 0 0 C 50 0, 50 80, 150 80" fill="none" stroke="rgba(255, 182, 145, 0.5)" stroke-dasharray="4 4" stroke-width="2"></path>
</svg>
</div>
<!-- Bounding Box 2: Avocado -->
<div class="absolute top-[55%] right-[20%] z-20">
<div class="w-16 h-16 border-2 border-tertiary rounded-lg relative">
<div class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-tertiary"></div>
<div class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-tertiary"></div>
<div class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-tertiary"></div>
<div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-tertiary"></div>
</div>
<div class="absolute -top-8 left-1/2 -translate-x-1/2 whitespace-nowrap glass-panel px-3 py-1 rounded-full flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-tertiary kinetic-pulse relative"><div class="absolute inset-0 rounded-full bg-tertiary"></div></div>
<span class="font-label-caps text-label-caps text-on-surface">Avocado - 50g</span>
</div>
</div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-30 h-full flex flex-col justify-between p-container-padding pb-[100px]">
<!-- Top Controls -->
<div class="flex justify-between items-center pt-8">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
<div class="glass-panel px-4 py-2 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="center_focus_strong">center_focus_strong</span>
<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">Scanning...</span>
</div>
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface" data-icon="flash_on">flash_on</span>
</button>
</div>
<!-- Bottom floating elements -->
<div class="flex flex-col gap-stack-md mt-auto mb-stack-lg">
<!-- Floating Macro Card -->
<div class="glass-panel p-stack-md rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.3)]">
<div class="flex justify-between items-start mb-stack-md">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Estimated Meal</h2>
<p class="font-body-sm text-body-sm text-text-secondary">AI Confidence: 94%</p>
</div>
<div class="text-right">
<span class="font-display text-display text-primary block leading-none">420</span>
<span class="font-label-caps text-label-caps text-text-secondary">KCAL</span>
</div>
</div>
<!-- Macro Progress Bars -->
<div class="grid grid-cols-3 gap-inline-gutter">
<!-- Protein -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface">PRO</span>
<span class="font-body-sm text-body-sm text-text-secondary">35g</span>
</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-[70%] rounded-full"></div>
</div>
</div>
<!-- Carbs -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface">CRB</span>
<span class="font-body-sm text-body-sm text-text-secondary">42g</span>
</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed-dim w-[40%] rounded-full"></div>
</div>
</div>
<!-- Fats -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface">FAT</span>
<span class="font-body-sm text-body-sm text-text-secondary">15g</span>
</div>
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-tertiary-container w-[25%] rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-body-md text-body-md py-4 rounded-full flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(255,182,145,0.3)] hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                Log Meal
            </button>
</div>
</div>
</body></html>
